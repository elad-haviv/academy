<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8">

<style>
  html,body { margin:0; padding:0 }
  .card {
    width:1200px; height:630px; box-sizing:border-box; position:relative; overflow:hidden;
    background:#edefe9; color:#151d21; font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif;
    padding:64px 80px 76px; display:flex; flex-direction:column; justify-content:space-between;
    background-image:
      linear-gradient(to right, rgba(21,29,33,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(21,29,33,.05) 1px, transparent 1px);
    background-size:32px 32px;
  }
  .top, .foot { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2 }
  .brandline { display:flex; align-items:center; gap:16px }
  .wordmark { font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:31px; letter-spacing:-.01em }
  .kicker { font-family:'IBM Plex Mono',monospace; font-size:15px; color:#626d74; direction:ltr }
  .mid { position:relative; z-index:2; max-width:760px }
  h1 { font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:70px; line-height:1.08; margin:0; letter-spacing:-.02em }
  .sub { font-size:26px; color:#4b565c; margin:22px 0 0; max-width:28ch; line-height:1.45 }
  .stats { display:flex; gap:40px; font-size:17px; color:#4b565c; align-items:baseline }
  .stats span { display:inline-flex; align-items:baseline; gap:8px }
  .stats b { font-family:'Frank Ruhl Libre',serif; font-size:28px; color:#151d21; font-weight:700 }
  .wm { position:absolute; left:-70px; bottom:-90px; opacity:.075; z-index:1 }
  .rule { position:absolute; left:0; right:0; bottom:0; height:10px;
          background:linear-gradient(90deg,#3df5a7 0%,#26b9c1 48%,#096fe0 100%) }
</style>
